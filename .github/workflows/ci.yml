name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install frontend deps
        run: |
          cd src/frontend
          npm ci
      - name: Build frontend
        run: |
          cd src/frontend
          npm run build
      - name: Install backend deps
        run: |
          cd src/backend
          npm ci
      - name: Run backend tests
        run: |
          cd src/backend
          npm test
